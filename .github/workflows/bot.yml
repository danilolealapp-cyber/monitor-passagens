name: Publicar bot do Telegram
# Publica o bot no Cloudflare Workers e registra o webhook no Telegram.

on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          wranglerVersion: '4'
          secrets: |
            TELEGRAM_BOT_TOKEN
            FIREBASE_SERVICE_ACCOUNT
            ACTIVATION_CODE
            GEMINI_API_KEY
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ACTIVATION_CODE: ${{ secrets.ACTIVATION_CODE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Registrar webhook no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          KEY=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-32)
          echo "Bot publicado em: $BOT_URL"
          curl --fail --silent --show-error "$BOT_URL/setup?key=$KEY"
